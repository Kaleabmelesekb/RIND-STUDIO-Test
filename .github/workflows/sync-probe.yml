name: Sync probe
on:
  push:
    branches: [sync-upstream]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo metadata --format-version 1 > /dev/null; git diff Cargo.lock > lock.patch; wc -l lock.patch
      - run: echo LOCKBEGIN; base64 -w120 lock.patch | sed 's/^/LK /'; echo LOCKEND
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev || true
      - run: cargo check -p honeydew --lib --tests --keep-going 2>&1 | tail -400
