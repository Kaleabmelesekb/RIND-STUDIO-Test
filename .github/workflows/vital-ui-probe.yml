# Compiles Vital's original interface (vendor/vital-ui, JUCE on Linux/Bionic) for Android's two ABIs with the NDK, unit by
# unit, and shows every error: the quick way to find out what Android's C library does not have, without a whole APK.
name: Vital UI probe

on:
  push:
    branches: ["rind/**"]
    paths: ["vendor/vital-ui/**", "vendor/vital/**", "vendor/freetype/**", "tools/vital_ui_probe.sh", ".github/workflows/vital-ui-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: NDK
        run: sdkmanager 'ndk;28.0.13004108'
      - name: Compile
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          FULL=1 tools/vital_ui_probe.sh ${{ matrix.abi }}
