[package]
name = "rind-wavetable"
description = "Rind Wavetable: J-SYN's engine in the ML Studio look"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "rind_wavetable"
doctest = false

[features]
# Compiled into Honeydew: no exported plugin entry points.
linked = []
# Honeydew (vendored addition): the editor draws into Honeydew's own window (`os-plugkit`'s `embed`).
embed = ["ml-mix-core/embed", "os-plugkit/embed"]

[dependencies]
nih_plug = { path = "../../nih-plug" }
ml-mix-core = { path = "../ml-mix-core" }
os-plugkit = { path = "../../lemon-studio/os-plugkit" }
ml-small-fx = { path = "../ml-small-fx" }
j-syn-dsp = { path = "../../j-syn-dsp" }

[lints.rust]
unknown_lints = "allow"
dead_code = "allow"
