[package]
name = "ml-small-fx"
description = "ML Studio's small effects (Lemon Soft Clipper, Lemon Fast Distortion, Lemon Balance, Lemon Stereo Enhancer, Lemon Transient Processor, Lemon Chorus, Lemon Stereo Shaper): the plugin, parameters and editor they share"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "ml_small_fx"
doctest = false

[features]
# Compiled into Honeydew: no exported plugin entry points.
linked = []
# Honeydew (vendored addition): the editor draws into Honeydew's own window (`os-plugkit`'s `embed`).
embed = ["os-hostlink/embed", "os-plugkit/embed"]

[dependencies]
nih_plug = { path = "../../nih-plug" }
os-engine = { path = "../../lemon-studio/os-engine", features = ["plugins"] }
os-hostlink = { path = "../../lemon-studio/os-hostlink" }
os-plugkit = { path = "../../lemon-studio/os-plugkit" }
os-ui = { path = "../../lemon-studio/os-ui" }
os-theme = { path = "../../lemon-studio/os-theme" }
serde_json = "1"

[build-dependencies]
cc = "1"

[lints.rust]
unknown_lints = "allow"
dead_code = "allow"
