[package]
name = "ml-tools-core"
description = "ml-tools-core"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "ml_tools_core"
doctest = false

[features]
# Compiled into Honeydew: no exported plugin entry points.
linked = []
# Honeydew (vendored addition): the editor draws into Honeydew's own window (`os-plugkit`'s `embed`).
embed = ["ml-small-fx/embed", "os-plugkit/embed"]

[dependencies]
nih_plug = { path = "../../nih-plug" }
ml-small-fx = { path = "../ml-small-fx" }
os-plugkit = { path = "../../lemon-studio/os-plugkit" }
os-ui = { path = "../../lemon-studio/os-ui" }
os-dsp = { path = "../../lemon-studio/os-dsp" }
signalsmith-stretch = "0.1.3"
ebur128 = { version = "0.1.11", default-features = false }

[lints.rust]
unknown_lints = "allow"
dead_code = "allow"
