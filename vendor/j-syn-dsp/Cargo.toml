[package]
name = "j-syn-dsp"
description = "J-SYN: zero-allocation polyphonic wavetable synthesizer DSP engine (https://github.com/jakehukkanen/J-SYN)"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Jake Hukkanen"]
publish = false

[lib]
doctest = false

[dependencies]
arc-swap = "1.7"
hound = "3.5"
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }

[lints.rust]
unknown_lints = "allow"
dead_code = "allow"
