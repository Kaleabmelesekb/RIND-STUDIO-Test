[package]
name = "lemon-bass"
description = "Lemon Bass: Lemon Studio's bass guitar as a VST3 / CLAP plugin"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
doctest = false

[features]
# Compiled into Honeydew: no exported plugin entry points (they would clash with the other built-in plugins).
linked = []
# Honeydew (vendored addition): the editor draws into Honeydew's own window (`os-plugkit`'s `embed`).
embed = ["lemon-small-gen/embed"]

[dependencies]
nih_plug = { path = "../../nih-plug" }
lemon-small-gen = { path = "../lemon-small-gen" }
os-plugkit = { path = "../../lemon-studio/os-plugkit" }

[lints.rust]
unknown_lints = "allow"
