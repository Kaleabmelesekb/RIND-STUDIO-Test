[package]
name = "lemon-small-gen"
description = "Mango Studio's small generators (Lemon Kick, Boom, Bass, Acid and the Mango instruments): the plugin, parameters and editor they share"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
doctest = false

[features]
# Honeydew (vendored addition): the editor draws into Honeydew's own window (`os-plugkit`'s `embed`).
embed = ["os-plugkit/embed", "os-hostlink/embed"]

[dependencies]
nih_plug = { path = "../../nih-plug" }
os-hostlink = { path = "../../lemon-studio/os-hostlink" }
os-plugkit = { path = "../../lemon-studio/os-plugkit" }
os-ui = { path = "../../lemon-studio/os-ui" }
os-theme = { path = "../../lemon-studio/os-theme" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_System_LibraryLoader"] }

[lints.rust]
unknown_lints = "allow"
dead_code = "allow"
